name: Build Applications

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact: stickyhomeworks2-windows
            path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS
            os: macos-latest
            bundles: app,dmg
            artifact: stickyhomeworks2-macos
            path: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm
            artifact: stickyhomeworks2-linux
            path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop installer
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The generated Android project is a CI build product, not application source.
      - name: Initialize Android target
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Build Android APK and AAB
        run: npm run tauri -- android build

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stickyhomeworks2-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned archive)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The generated Apple project is a CI build product, not application source.
      - name: Initialize iOS target
        run: npm run tauri -- ios init --ci --skip-targets-install

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          npm run build
          project_path="$(find "$GITHUB_WORKSPACE/src-tauri/gen/apple" -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$project_path" || { echo "Tauri iOS initialization did not create an Xcode project"; exit 1; }
          scheme_list_path="$RUNNER_TEMP/xcode-schemes.json"
          xcodebuild -list -json -project "$project_path" > "$scheme_list_path"
          scheme="$(plutil -extract project.schemes.0 raw -o - "$scheme_list_path")"
          test -n "$scheme" || { echo "Xcode project has no shared scheme"; exit 1; }
          archive_path="$RUNNER_TEMP/stickyhomeworks2.xcarchive"
          build_settings_path="$RUNNER_TEMP/ios-build-settings.txt"

          xcodebuild \
            -project "$project_path" \
            -scheme "$scheme" \
            -configuration release \
            -sdk iphoneos \
            -showBuildSettings > "$build_settings_path"
          grep -Eq '^[[:space:]]*CONFIGURATION = release$' "$build_settings_path" \
            || { echo "Expected the Tauri release configuration before archiving"; cat "$build_settings_path"; exit 1; }

          xcodebuild \
            -project "$project_path" \
            -scheme "$scheme" \
            -configuration release \
            -sdk iphoneos \
            -archivePath "$archive_path" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: stickyhomeworks2-ios-unsigned
          path: ${{ runner.temp }}/stickyhomeworks2.xcarchive
          if-no-files-found: error
