[package]
name = "stickyhomeworks2"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stickyhomeworks2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
zip = "2"
base64 = "0.22"
# 日志时间戳使用 RFC 3339（logger 在移动端也会编译，因此不能只放在桌面依赖组）
chrono = "0.4"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
glycoprotein = "=0.1.0"
schemars = "1"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-single-instance = "2"
# 窗口位置/尺寸/最大化由官方插件持久化，取代自己写 settings 的几何字段
tauri-plugin-window-state = "2"

# VS 2026（MSVC 14.51）在 /Z7 下会把完整编译命令行写进调试记录，
# zstd-sys / bzip2-sys / lzma-sys 这类用 cc 编译的 C 依赖会直接报
# `cl: 命令行 error D8050 :无法执行 c1.dll：未能将命令行放入调试记录中`。
# 依赖不带调试信息即可绕开本机工具链的问题，本地 crate 的调试信息不受影响。
[profile.dev.package."*"]
debug = false
